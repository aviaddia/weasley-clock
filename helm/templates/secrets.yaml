apiVersion: v1
kind: Secret
metadata:
  name: {{ include "weasley-clock.fullname" . }}-secrets
  labels:
    {{- include "weasley-clock.labels" . | nindent 4 }}
type: Opaque
# Values are empty by default; inject real secrets via:
#   helm upgrade --install weasley-clock ./helm \
#     --set-string backend.env.LOCATION_API_KEY=<key> \
#     --set-string backend.env.PHONE_VALIDATION_API_KEY=<key>
# Or manage externally with External Secrets Operator / AWS Secrets Manager.
stringData:
  PHONE_VALIDATION_API_URL: {{ .Values.backend.env.PHONE_VALIDATION_API_URL | quote }}
  PHONE_VALIDATION_API_KEY: {{ .Values.backend.env.PHONE_VALIDATION_API_KEY | quote }}
  LOCATION_API_URL: {{ .Values.backend.env.LOCATION_API_URL | quote }}
  LOCATION_API_KEY: {{ .Values.backend.env.LOCATION_API_KEY | quote }}
