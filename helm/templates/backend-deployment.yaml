apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "weasley-clock.fullname" . }}-backend
  labels:
    {{- include "weasley-clock.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: {{ include "weasley-clock.backendImage" . }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.port }}
          env:
            - name: PORT
              value: "{{ .Values.backend.port }}"
            - name: DATA_PATH
              value: {{ .Values.backend.persistence.mountPath }}
            - name: PHONE_VALIDATION_API_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "weasley-clock.fullname" . }}-secrets
                  key: PHONE_VALIDATION_API_URL
                  optional: true
            - name: PHONE_VALIDATION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "weasley-clock.fullname" . }}-secrets
                  key: PHONE_VALIDATION_API_KEY
                  optional: true
            - name: LOCATION_API_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "weasley-clock.fullname" . }}-secrets
                  key: LOCATION_API_URL
                  optional: true
            - name: LOCATION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "weasley-clock.fullname" . }}-secrets
                  key: LOCATION_API_KEY
                  optional: true
          {{- if .Values.backend.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.backend.persistence.mountPath }}
          {{- end }}
          {{- if .Values.backend.probes.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.probes.liveness.path }}
              port: {{ .Values.backend.port }}
            initialDelaySeconds: {{ .Values.backend.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.backend.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.probes.readiness.path }}
              port: {{ .Values.backend.port }}
            initialDelaySeconds: {{ .Values.backend.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.backend.probes.readiness.failureThreshold }}
          startupProbe:
            httpGet:
              path: {{ .Values.backend.probes.startup.path }}
              port: {{ .Values.backend.port }}
            periodSeconds: {{ .Values.backend.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.backend.probes.startup.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      {{- if .Values.backend.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "weasley-clock.fullname" . }}-backend-data
      {{- end }}
